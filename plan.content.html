<title>Next Move</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --fd:'Bricolage Grotesque',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fb:'Public Sans',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --bg:#edf0f5; --surface:#ffffff; --surface2:#e2e7ef; --raise:0 1px 2px rgba(14,24,38,.06),0 4px 16px rgba(14,24,38,.06);
  --ink:#0e1826; --ink2:#48566a; --ink3:#78849a;
  --line:#d6dce6; --line2:#b5c0d0;
  --accent:#0f4c81; --accentSoft:#e4edf7; --accentLine:#a8c8e4;
  --mark:#d6f000; --markInk:#0e1826;
  --good:#137a4a; --warn:#a15c00; --bad:#b3261e;
  color-scheme:light;
  --s1:#0f4c81; --s2:#0f766e; --s3:#6d28d9; --s4:#be123c; --s5:#a15c00; --s6:#4d7c0f;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1219; --surface:#141b25; --surface2:#1c2531; --raise:0 1px 2px rgba(0,0,0,.45),0 4px 18px rgba(0,0,0,.4);
  --ink:#e9eef5; --ink2:#a3aebd; --ink3:#6f7b8b;
  --line:#242e3b; --line2:#33404f;
  --accent:#7cc4ff; --accentSoft:#122437; --accentLine:#22496e;
  --mark:#d6f000; --markInk:#0e1826;
  --good:#4ade80; --warn:#fbbf24; --bad:#f87171;
  color-scheme:dark;
  --s1:#7cc4ff; --s2:#2dd4bf; --s3:#a78bfa; --s4:#fb7185; --s5:#fbbf24; --s6:#a3e635;
}}
:root[data-theme="dark"]{
  --bg:#0d1219; --surface:#141b25; --surface2:#1c2531; --raise:0 1px 2px rgba(0,0,0,.45),0 4px 18px rgba(0,0,0,.4);
  --ink:#e9eef5; --ink2:#a3aebd; --ink3:#6f7b8b;
  --line:#242e3b; --line2:#33404f;
  --accent:#7cc4ff; --accentSoft:#122437; --accentLine:#22496e;
  --mark:#d6f000; --markInk:#0e1826;
  --good:#4ade80; --warn:#fbbf24; --bad:#f87171;
  color-scheme:dark;
  --s1:#7cc4ff; --s2:#2dd4bf; --s3:#a78bfa; --s4:#fb7185; --s5:#fbbf24; --s6:#a3e635;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:400 16px/1.55 var(--fb);
  -webkit-text-size-adjust:100%; overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--fd);line-height:1.15;margin:0;font-weight:800;letter-spacing:-.015em;text-wrap:balance}
.mono,.fitscore,.tvnum,td,th{font-variant-numeric:tabular-nums}
svg.chart text{font-family:var(--fb);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
p{margin:0 0 .85em}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:.5em .6em;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
textarea{resize:vertical;min-height:4.2em;line-height:1.5}
.wrap{max-width:940px;margin:0 auto;padding:0 18px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

/* top bar */
#topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#topbar.hide{display:none}
.bar{display:flex;align-items:center;gap:14px;max-width:940px;margin:0 auto;padding:9px 18px}
.brand{font-family:var(--fd);font-weight:800;letter-spacing:-.02em;font-size:15.5px;white-space:nowrap}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
nav::-webkit-scrollbar{display:none}
nav button{padding:6px 11px;border-radius:7px;color:var(--ink2);font-size:14.5px;white-space:nowrap;font-weight:500}
nav button[aria-current="true"]{background:var(--mark);color:var(--markInk);font-weight:700}
.iconbtn{width:32px;height:32px;border-radius:7px;display:grid;place-items:center;color:var(--ink2);flex:none}
#saved{font-size:12px;color:var(--ink3);white-space:nowrap;opacity:0;transition:opacity .5s}
#saved.on{opacity:1;transition:none}

main{padding:26px 0 90px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
.lede{color:var(--ink2);font-size:16.5px;max-width:62ch}
.dim{color:var(--ink3)}
.small{font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--raise)}
.hr{height:1px;background:var(--line);border:0;margin:26px 0}

.btn{background:var(--mark);color:var(--markInk);border-radius:10px;padding:.62em 1.15em;font-weight:700;display:inline-flex;align-items:center;gap:.5em}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2);font-weight:500}
.btn.sm{padding:.42em .8em;font-size:14px;border-radius:8px}
.btn.danger{color:var(--bad);border-color:var(--line2);background:transparent;font-weight:500}

/* welcome */
.welcome{min-height:74vh;display:flex;flex-direction:column;justify-content:center;max-width:640px}
.welcome h1{font-size:clamp(38px,8vw,62px);letter-spacing:-.04em;margin-bottom:18px;line-height:1.02}
.welcome .lede{font-size:clamp(17px,2.4vw,19px);line-height:1.5}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 30px}
.fact{font-size:13px;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px}

/* mirror */
.mcard{padding:30px 26px;max-width:560px;margin:0 auto}
.mcount{font-size:12.5px;color:var(--ink3);letter-spacing:.04em;margin-bottom:16px;display:flex;justify-content:space-between}
.mtrack{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:22px}
.mtrack i{display:block;height:100%;background:var(--mark);border-radius:3px;transition:width .28s}
.mcard h2{font-size:clamp(24px,5.2vw,31px);letter-spacing:-.025em}
.mcard .sub{color:var(--ink2);margin:10px 0 24px;font-size:15.5px}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rate button{aspect-ratio:1;border:1px solid var(--line2);border-radius:11px;font-size:19px;font-weight:650;color:var(--ink2);background:var(--surface)}
.rate button.on{background:var(--mark);color:var(--markInk);border-color:var(--mark)}
.ratelabels{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-top:9px}
.mnav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:10px}

/* reflection */
.topvals{display:flex;flex-direction:column;gap:9px;margin:16px 0 4px}
.tv{display:flex;align-items:center;gap:12px}
.tvbar{flex:1;height:9px;background:var(--surface2);border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.tvbar i{display:block;height:100%;background:var(--accent)}
.mcard h2,.pname{font-family:var(--fd)}
.tvname{width:min(48vw,230px);font-size:14.5px}
.tvnum{width:28px;text-align:right;font-size:13px;color:var(--ink3)}
.tension{border-left:3px solid var(--accent);background:var(--accentSoft);border-radius:0 11px 11px 0;padding:14px 16px;margin-bottom:10px}
.tension b{display:block;font-size:14.5px;margin-bottom:5px}
.tension p{margin:0;font-size:14.5px;color:var(--ink2)}

/* generic layout */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:5px}
.field .hint{font-size:12.5px;color:var(--ink3);font-weight:400;margin-top:-3px;margin-bottom:5px}

/* paths */
.plist{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(268px,1fr))}
.ptile{padding:17px;text-align:left;display:flex;flex-direction:column;gap:9px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--raise);width:100%}
.ptop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ptype{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.pname{font-size:17.5px;font-weight:650;letter-spacing:-.02em;margin-top:2px}
.ring{width:42px;height:42px;flex:none}
.ring text{font-size:11px;font-weight:700;fill:var(--ink2)}
.padd{border:1.5px dashed var(--line2);background:transparent;box-shadow:none;align-items:center;justify-content:center;min-height:132px;color:var(--ink2);font-weight:600;display:flex;text-align:center}
.fitpill{font-size:12.5px;padding:2px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);display:inline-block}

.sec{border-top:1px solid var(--line);padding-top:20px;margin-top:24px}
.sec h3{font-size:17px;margin-bottom:3px}
.sec .subh{color:var(--ink3);font-size:13.5px;margin-bottom:16px}

.rrow{display:grid;grid-template-columns:minmax(150px,1fr) 2fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.rrow:last-child{border-bottom:0}
.rq{font-size:14px;font-weight:600;padding-top:6px}
.rq .qhint{display:block;font-weight:400;color:var(--ink3);font-size:12.5px;margin-top:2px}
.rin{display:flex;flex-direction:column;gap:7px}
.subrow{display:grid;grid-template-columns:1fr 118px;gap:7px}
.unk{font-size:12px;color:var(--ink3);display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none;padding:2px 0}
.unk input{width:auto;margin:0}
.unk.on{color:var(--accent);font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line2);border-radius:999px;padding:6px 13px;font-size:14px;color:var(--ink2);background:var(--surface)}
.chip.on{background:var(--mark);color:var(--markInk);border-color:var(--mark);font-weight:600}

.want{display:flex;gap:8px;align-items:center}
.want button{width:38px;height:38px;border:1px solid var(--line2);border-radius:9px;font-weight:650;color:var(--ink2)}
.want button.on{background:var(--mark);color:var(--markInk);border-color:var(--mark)}

.copysel{width:auto;max-width:200px;font-size:13px;padding:.34em .5em;border-radius:8px;color:var(--ink2);flex:none}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.fitbox{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
.fitscore{font-family:var(--fd);font-size:33px;font-weight:800;letter-spacing:-.03em;line-height:1}
.fitterm{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:3px 0;color:var(--ink2);align-items:baseline}
.fitterm span:last-child{white-space:nowrap;flex:none}
.fitterm b{font-weight:600;color:var(--ink)}

/* money */
.chartbox{overflow-x:auto;padding:4px 0}
svg.chart{display:block;width:100%;min-width:560px;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px}
.lg{display:flex;align-items:center;gap:7px;font-size:13.5px}
.lgs{width:26px;height:0;border-top-width:2.5px;border-top-style:solid;flex:none}
.est{background:var(--accentSoft);border:1px solid var(--accentLine);border-radius:11px;padding:13px 15px;font-size:14px;color:var(--ink2);margin-bottom:20px}
.est b{color:var(--ink)}

/* tables */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:13px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:14px}
th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);font-weight:700;background:var(--surface2);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
th.rowhead{font-weight:600;color:var(--ink2);font-size:13.5px;width:190px}
.na{color:var(--ink3);font-style:italic;font-size:13px}
button.na{padding:0;text-align:left;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
th button.colhead{font:inherit;color:inherit;padding:0;text-align:left;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.flash{outline:3px solid var(--mark);outline-offset:3px;border-radius:10px}

/* timeline */
.ms{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.ms:last-child{border-bottom:0}
.msbox{width:21px;height:21px;border:1.5px solid var(--line2);border-radius:6px;flex:none;margin-top:2px;display:grid;place-items:center;background:var(--surface)}
.msbox.on{background:var(--good);border-color:var(--good);color:#fff}
.msbody{flex:1;min-width:0}
.msdate{font-size:12px;color:var(--ink3);letter-spacing:.03em}
.msdate.due{color:var(--bad);font-weight:650}
.msdate.soon{color:var(--warn);font-weight:650}
.mstext{font-size:15px}
.ms.done .mstext{color:var(--ink3);text-decoration:line-through}

.toastbtn{margin-left:10px;background:var(--mark);color:var(--markInk);border-radius:7px;padding:.25em .7em;font-weight:700;font-size:13.5px}
#sharedbar{display:none;background:var(--accentSoft);border-bottom:1px solid var(--accentLine);color:var(--ink);font-size:14px;padding:10px 18px;text-align:center}
#sharedbar b{font-weight:700}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);background:var(--ink);color:var(--bg);padding:10px 17px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (hover:hover) and (pointer:fine){
  nav button:hover{background:var(--surface2);color:var(--ink)}
  .iconbtn:hover{background:var(--surface2);color:var(--ink)}
  .btn:hover{opacity:.87}
  .btn.ghost:hover{background:var(--surface2);opacity:1}
  .rate button:hover:not(.on){border-color:var(--ink3);color:var(--ink)}
  button.na:hover,th button.colhead:hover{color:var(--accent)}
  .ptile:hover{border-color:var(--line2)}
  .padd:hover{border-color:var(--accent);color:var(--accent);background:var(--accentSoft)}
  .chip:hover:not(.on){border-color:var(--ink3)}
}
#printdoc{display:none}
@media print{
  #topbar,main,#toast{display:none!important}
  #printdoc{display:block;color:#000;background:#fff;max-width:none;padding:0}
  body{background:#fff;color:#000;font-size:11pt}
  .pd-h1{font-family:var(--fd);font-size:20pt;letter-spacing:-.02em;margin:0 0 4pt}
  .pd-meta{font-size:9.5pt;color:#333;margin:0 0 14pt}
  .pd-meta span{margin-right:14pt;white-space:nowrap}
  .pd-h2{font-family:var(--fd);font-size:12pt;margin:16pt 0 6pt;border-bottom:1px solid #000;padding-bottom:3pt;break-after:avoid}
  .pd-item{display:flex;gap:7pt;padding:3.5pt 0;break-inside:avoid;align-items:flex-start}
  .pd-box{width:11pt;height:11pt;border:1pt solid #000;flex:none;margin-top:1.5pt;text-align:center;line-height:10pt;font-size:9pt}
  .pd-t{flex:1}
  .pd-when{font-size:9pt;color:#444;white-space:nowrap;padding-left:6pt}
  .pd-src{font-size:8.5pt;color:#555;text-transform:uppercase;letter-spacing:.05em}
  .pd-path{break-inside:avoid;margin:0 0 11pt;padding:7pt 9pt;border:1pt solid #999}
  .pd-path h4{font-family:var(--fd);font-size:11.5pt;margin:0 0 3pt}
  .pd-facts{font-size:9.5pt;color:#222;margin:0 0 4pt}
  .pd-facts b{font-weight:700}
  .pd-q{font-size:9.5pt;margin:2pt 0 0}
  .pd-sign{margin-top:20pt;font-size:10pt;break-inside:avoid}
  .pd-sign div{margin-top:16pt;border-bottom:1px solid #000;height:1pt;width:74%}
  .pd-sign small{color:#444}
  @page{margin:14mm}
}
@media (max-width:640px){
  .grid2{grid-template-columns:1fr}
  .rrow{grid-template-columns:1fr;gap:7px}
  .rq{padding-top:0}
  .subrow{grid-template-columns:1fr}
  .bar{gap:9px;padding:8px 14px}
  .brand{display:none}
  .wrap{padding:0 14px}
  th.rowhead{width:140px}
}
</style>

<div id="sharedbar"></div>
<div id="topbar" class="hide">
  <div class="bar">
    <div class="brand">Next Move</div>
    <nav id="nav"></nav>
    <span id="saved">saved</span>
    <button class="iconbtn" id="themeBtn" title="Light / dark" aria-label="Toggle light or dark">◐</button>
  </div>
</div>
<main><div class="wrap" id="main"></div>
<div class="wrap" id="copyout" style="display:none;padding-bottom:30px">
  <textarea id="copyarea" style="min-height:9em" readonly></textarea>
  <div class="small dim" style="margin-top:6px">Your browser would not copy this for you. Select it all, copy it, and keep it somewhere safe.</div>
</div></main>
<div id="printdoc" aria-hidden="true"></div>
<div id="toast"></div>
<script data-app>
/* ---------- content ---------- */
const FACTORS=[

const TENSIONS=[

 {a:'hands',b:'predictable',t:'Hands-on work vs. a predictable schedule',
  x:'Plenty of trades run on weather, call-outs, and overtime. Predictable hands-on work does exist, so make it a question you ask every program: what does a normal week actually look like?'},
 {a:'creative',b:'predictable',t:'Creative work vs. a predictable schedule',
  x:'Creative work that pays on a schedule almost always means doing it inside a company. Working for yourself buys freedom and sells stability.'},
 {a:'switch',b:'earnSoon',t:'Keeping options open vs. money soon',
  x:'The fastest-paying paths are the most specific ones. Staying flexible usually means broader training that pays later.'},
 {a:'help',b:'longEarn',t:'Helping people vs. top-end pay',
  x:'Public service work matters and is rarely the top of the pay scale. The exceptions are real, mostly in health care. Worth finding out which ones.'},
 {a:'tech',b:'hands',t:'Technology and hands-on work together',
  x:'This is not a conflict, it is a lane: industrial maintenance, robotics techs, avionics, HVAC controls, lineworkers, biomed equipment. Those jobs are hard to fill and they know it.'},
 {a:'near',b:'longEarn',t:'Staying near home vs. top-end pay',
  x:'What a credential pays depends heavily on where you use it. If you want to stay put, check what these jobs pay here specifically, not the national number.'}
];
const FREE=[
 {id:'likes',  l:'Stuff you actually like doing', h:'School or not. Games, fixing things, arguing, drawing, coaching, whatever.'},
 {id:'goodAt', l:'Things you are good at, or would be willing to get good at', h:'The second half counts as much as the first.'},

function b64url(bytes){

async function encodeSeed(payload){
  const bytes=new TextEncoder().encode(JSON.stringify(payload));

  try{
    const cs=new CompressionStream('gzip');
    const w=cs.writable.getWriter(); w.write(bytes); w.close();
    const buf=await new Response(cs.readable).arrayBuffer();

  }else{
    h+='<p class="small dim" style="margin-top:14px">Rate the twelve on the You tab and a match score shows up here.</p>';
  }
  h+='</div>';

  h+='<div class="sec"><h3>Getting in</h3><div class="subh">Use their words, from their page. Not what someone told you.</div>';
  (REQS[p.type]||[]).forEach(r=>h+=reqRow(p,r));
  h+='</div>';

  h+='<div class="sec">'+secHead('The money',copyFrom(p,'money'))+'<div class="subh">Four numbers. These draw your line on the Money tab. Leave one blank and a rough national estimate fills in, marked as an estimate.'+
   (copyFrom(p,'money')?' Copying from another path brings the other three across but never what you pay, since tuition is different at every school.':'')+
   '</div><div class="grid2">';
  MONEY.forEach(m=>{const v=p.money[m.id], isNum=num(v)!==null;
    h+='<div class="field"><label>'+esc(m.l)+'</label><div class="hint">'+esc(m.h)+(isNum?'':' · using estimate '+ (m.pre==='$'?money(SEEDS[p.type][m.id]):SEEDS[p.type][m.id]+' yrs'))+'</div>';
    if(m.id==='years'){
      const y=num(v), listed=y!==null&&y>=1&&y<=6&&y===Math.round(y);
      const asNum=yearsOther[p.id]||(y!==null&&!listed);
      if(asNum)h+='<input type="number" inputmode="numeric" min="0" step="0.5" data-k="'+p.id+'|money.years" value="'+esc(v)+'" placeholder="years">';
      else{
        h+='<select data-k="'+p.id+'|money.years"><option value="">Not sure yet</option>';
        for(let n=1;n<=6;n++)h+='<option value="'+n+'"'+(y===n?' selected':'')+'>'+n+' year'+(n===1?'':'s')+'</option>';
        h+='<option value="__other">Something else</option></select>';
      }
    }else{
      h+='<input type="number" inputmode="numeric" min="0" data-k="'+p.id+'|money.'+m.id+'" value="'+esc(v)+'" placeholder="dollars">';
    }
    h+='</div>';});
  h+='</div></div>';

  h+='<div class="sec">'+secHead('Reality check',copyFrom(p,'reality'))+'<div class="subh">Four questions the numbers above cannot answer. Tap an answer where there is one, and write whatever the taps do not cover.</div>';
  REALITY.forEach(r=>{
    const picked=(p.pick||{})[r.id];
    let ctl='';
    if(r.type==='one'||r.type==='many'){
      ctl='<div class="chips">'+optsFor(p,r).map(o=>{
        const on=r.type==='many'?(Array.isArray(picked)&&picked.indexOf(o.id)>-1):(picked===o.id);
        return '<button class="chip '+(on?'on':'')+'" data-act="pick" data-id="'+p.id+'" data-f="'+r.id+'"'+
          (r.type==='many'?' data-multi="1"':'')+' data-v="'+o.id+'">'+esc(o.l)+'</button>';
      }).join('')+'</div>';
    }else if(r.type==='sel'){
      ctl='<select data-k="'+p.id+'|pick.'+r.id+'"><option value="">Pick one, or just write it below</option>'+
        optsFor(p,r).map(o=>'<option value="'+esc(o.id)+'"'+(picked===o.id?' selected':'')+'>'+esc(o.l)+'</option>').join('')+'</select>';
    }
    const ph=r.type==='text'?'':'Anything to add (optional)';
    h+='<div class="rrow"><div class="rq">'+esc(r.q)+'<span class="qhint">'+esc(r.h)+'</span></div>'+
      '<div class="rin">'+ctl+
      '<textarea data-k="'+p.id+'|reality.'+r.id+'" placeholder="'+ph+'"'+(r.type==='text'?'':' style="min-height:2.8em"')+'>'+esc(p.reality[r.id]||'')+'</textarea>'+
      '</div></div>';
  });
  const old2=RETIRED.filter(r=>(p.reality[r.id]||'').trim());
  if(old2.length){
    h+='<div style="margin-top:16px;padding:12px 14px;border:1px dashed var(--line2);border-radius:11px">'+
       '<div class="small dim" style="margin-bottom:8px">You answered these before. They are now covered by the money numbers above, so they are kept here for reference only.</div>';
    old2.forEach(r=>{h+='<div class="small" style="margin-bottom:6px"><b>'+esc(r.q)+':</b> '+esc(p.reality[r.id])+'</div>';});
    h+='</div>';
  }
  h+='</div>';

  const oldMoney=(p.tuesday.money||'').trim();
  const box=t=>'<div class="field"><label>'+esc(t.q)+'</label><textarea style="min-height:5.5em" data-k="'+p.id+'|tuesday.'+t.id+'">'+esc(p.tuesday[t.id]||'')+'</textarea></div>';
  const extra=TUES.filter(t=>!t.core);
  const showExtra=tuesMore[p.id]||extra.some(t=>(p.tuesday[t.id]||'').trim());
  h+='<div class="sec">'+secHead('A Tuesday, five years after high school',copyFrom(p,'tuesday'))+''+
     '<div class="subh">It is five years after you finish high school and you are about 23. Write it like you are describing it to a friend, and include the boring parts.</div>';
  if(oldMoney)h+='<div style="margin-bottom:14px;padding:12px 14px;border:1px dashed var(--line2);border-radius:11px">'+
    '<div class="small dim" style="margin-bottom:6px">You answered a question here about earnings and debt. The money numbers above cover it now, so this is kept for reference only.</div>'+
    '<div class="small">'+esc(oldMoney)+'</div></div>';
  TUES.filter(t=>t.core).forEach(t=>{h+=box(t);});
  if(showExtra)extra.forEach(t=>{h+=box(t);});
  else h+='<button class="unk" data-act="tuesmore" data-id="'+p.id+'">+ two more questions</button>';
  h+='</div>';

  h+='<div class="sec"><h3>Proof you actually looked</h3><div class="subh">Rankings and opinions do not count. These do.</div>';
  PROOF.forEach(x=>{
    if(x.type==='date'){
      const on=!!p.proof[x.id];
      h+='<div class="field"><label class="unk '+(on?'on':'')+'" style="font-size:15px">'+
        '<input type="checkbox" data-act="stamp" data-id="'+p.id+'" data-f="'+x.id+'" '+(on?'checked':'')+'> '+esc(x.l.replace(' on',''))+'</label>'+
        (on?'<input type="date" style="max-width:200px;margin-top:7px" data-k="'+p.id+'|proof.'+x.id+'" value="'+esc(p.proof[x.id])+'">':'')+
        '</div>';
      return;
    }
    if(x.id==='person'){
      const who=(p.pick||{}).person;
      h+='<div class="field"><label>'+esc(x.l)+'</label>'+(x.h?'<div class="hint">'+esc(x.h)+'</div>':'')+
        '<div class="chips" style="margin-bottom:8px">'+WHO.map(o=>
          '<button class="chip '+(who===o.id?'on':'')+'" data-act="pick" data-id="'+p.id+'" data-f="person" data-v="'+o.id+'">'+esc(o.l)+'</button>').join('')+'</div>'+
        '<input data-k="'+p.id+'|proof.person" placeholder="Their name, and what they do (optional)" value="'+esc(p.proof.person||'')+'"></div>';
      return;
    }
    h+='<div class="field"><label>'+esc(x.l)+'</label>'+(x.h?'<div class="hint">'+esc(x.h)+'</div>':'')+
      '<textarea data-k="'+p.id+'|proof.'+x.id+'">'+esc(p.proof[x.id]||'')+'</textarea></div>';});
  h+='</div>';

  h+='<div class="sec"><h3>How much do you want this today</h3><div class="subh">Today. It is allowed to change, and it probably will.</div><div class="want">';
  for(let n=1;n<=5;n++)h+='<button data-act="want" data-id="'+p.id+'" data-n="'+n+'" class="'+(p.want===n?'on':'')+'">'+n+'</button>';
  h+='</div></div>';

  h+='<div class="sec" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">'+
   '<button class="btn ghost sm" data-act="close">← All paths</button>'+
   '<button class="btn danger sm" data-act="del" data-id="'+p.id+'">Delete this path</button></div>';
  return h;
}
</script>
<script data-app>
/* ---------- money ---------- */
function vMoney(){
  let h='<div class="eyebrow">Money</div><h1 style="font-size:clamp(27px,5vw,36px);margin-bottom:10px">When does each one start paying you back?</h1>'+
   '<p class="lede">Every path takes money out of your pocket first and puts money back later. What matters is when your line crosses zero, and how steep it is after that.</p>';
  if(!S.paths.length)return h+'<div class="card" style="padding:26px;margin-top:22px"><p style="margin:0">Add a path first and its line shows up here.</p><p style="margin:14px 0 0"><button class="btn" data-act="go" data-v="paths">Add a path</button></p></div>';
  h+='<div class="est" style="margin-top:20px"><b>Dashed lines are my rough estimates, not facts.</b> Any of the four money numbers you leave blank on a path gets filled with a national ballpark so the chart is not empty. Fill in a real number you looked up and that part of the line turns solid. Solid means you checked.</div>';

  const all=S.paths.map(p=>({p:p,s:series(p)}));
  let lo=0,hi=0; all.forEach(o=>o.s.pts.forEach(pt=>{lo=Math.min(lo,pt.net);hi=Math.max(hi,pt.net);}));
  const pad=(hi-lo)*0.08||1000; lo-=pad; hi+=pad;
  const W=900,H=392,ml=66,mr=124,mt=18,mb=48;
  const X=a=>ml+(a-18)/12*(W-ml-mr), Y=n=>mt+(1-(n-lo)/(hi-lo))*(H-mt-mb);
  let g='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Net money by age for each path">';
  for(let i=0;i<=5;i++){
    const n=lo+(hi-lo)*i/5, y=Y(n);
    g+='<line x1="'+ml+'" y1="'+y+'" x2="'+(W-mr)+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>'+
       '<text x="'+(ml-9)+'" y="'+(y+4)+'" text-anchor="end" fill="var(--ink3)" font-size="12" font-family="ui-monospace,monospace">'+money(n)+'</text>';
  }
  g+='<line x1="'+ml+'" y1="'+Y(0)+'" x2="'+(W-mr)+'" y2="'+Y(0)+'" stroke="var(--ink3)" stroke-width="1.5"/>';
  for(let a=18;a<=30;a+=2){
    g+='<text x="'+X(a)+'" y="'+(H-28)+'" text-anchor="middle" fill="var(--ink3)" font-size="12">'+a+'</text>';
  }
  all.forEach((o,i)=>{
    const c=seriesColor(i);
    o.s.segs.forEach(sg=>{
      g+='<line x1="'+X(sg.a0)+'" y1="'+Y(sg.n0)+'" x2="'+X(sg.a1)+'" y2="'+Y(sg.n1)+'" stroke="'+c+'" stroke-width="2.6" stroke-linecap="round"'+(sg.seeded?' stroke-dasharray="5 5" opacity=".72"':'')+'/>';
    });
    const ey=Y(o.s.end);
    g+='<circle cx="'+X(30)+'" cy="'+ey+'" r="3.5" fill="'+c+'"/>'+
       '<text x="'+(X(30)+9)+'" y="'+(ey+4)+'" fill="'+c+'" font-size="12.5" font-weight="600">'+esc((o.p.name||typeLabel(o.p.type)).slice(0,13))+'</text>';
  });
  g+='<text x="'+(W/2)+'" y="'+(H-7)+'" text-anchor="middle" fill="var(--ink3)" font-size="11" letter-spacing=".06em">YOUR AGE</text></svg>';
  h+='<p class="small dim" style="margin:18px 0 2px">Running total of what you have earned, minus what training cost you. This is not a bank balance. Rent and food have not been taken out.</p>'+
     '<div class="chartbox">'+g+'</div><div class="legend">';
  all.forEach((o,i)=>{
    h+='<div class="lg"><span class="lgs" style="border-top-color:'+seriesColor(i)+';'+(o.s.anySeeded?'border-top-style:dashed':'')+'"></span>'+
     '<span><b>'+esc(o.p.name||typeLabel(o.p.type))+'</b> · '+(o.s.be?('in the black at '+o.s.be):(o.s.pts[1].net>=0?'never in the red':'still behind at 30'))+
     ' · '+money(o.s.end)+' earned by 30'+(o.s.anySeeded?' <span class="dim">(partly estimated)</span>':' <span style="color:var(--good)">(your numbers)</span>')+'</span></div>';
  });
  h+='</div>';
  h+='<p class="small dim" style="margin-top:20px">Three things this does not know. It leaves out rent, food, and everything you would pay no matter which path you took, because those hit every line roughly equally. It assumes your pay never changes, which it will. And it assumes you finish. Money is one axis out of about six, and it is the easiest one to measure, which is exactly why it ends up overweighted.</p>';
  return h;
}

/* ---------- compare ---------- */
function vCompare(){
  let h='<div class="eyebrow">Compare</div><h1 style="font-size:clamp(27px,5vw,36px);margin-bottom:10px">Side by side.</h1>'+
   '<p class="lede">Built from what you already typed. Blanks here are the questions you still have not answered.</p>';
  if(!S.paths.length)return h+'<div class="card" style="padding:26px;margin-top:22px"><p style="margin:0">Nothing to compare yet.</p><p style="margin:14px 0 0"><button class="btn" data-act="go" data-v="paths">Add a path</button></p></div>';
  /* An unanswered cell is a to-do, so it links to the box that answers it. */
  const na=(p,t)=>'<button class="na" data-act="goto" data-id="'+p.id+'" data-t="'+t+'">not answered</button>';
  const cell=(v,p,t)=>(v&&String(v).trim())?esc(v):na(p,t);
  const rows=[
   {l:'Kind of path',f:p=>esc(typeLabel(p.type))},
   {l:'Where',f:p=>cell(p.loc,p,'loc')},
   {l:'Time until you can work',f:p=>{const e=eff(p);
     return e.v.years+' yr'+(e.v.years===1?'':'s')+(e.seeded.years?' <span class="dim">(est)</span>':'');}},
   {l:'Total you pay to train',f:p=>{const e=eff(p);const t=e.v.years*e.v.cost;return money(t)+(e.seeded.cost||e.seeded.years?' <span class="dim">(est)</span>':'');}},
   {l:'Earned by 30, before rent',f:p=>{const s=series(p);return money(s.end)+(s.anySeeded?' <span class="dim">(est)</span>':'');}},
   {l:'Match with what you rated',f:p=>{const f2=fit(p);return f2?f2.score+'%':na(p,'chips');}},
   {l:'How much you want it',f:p=>p.want?p.want+' / 5':na(p,'want')},
   {l:'What would make you quit',f:p=>cell(answerText(p,realityBy('quit')),p,'quit')},
   {l:'Backup if you do not get in',f:p=>cell(answerText(p,realityBy('backup')),p,'backup')},
   {l:'Work where you want to live',f:p=>cell(answerText(p,realityBy('demand')),p,'demand')},
   {l:'Still unknown',f:p=>p.unknowns.length
     ?'<button class="na" style="font-style:normal;color:var(--warn)" data-act="goto" data-id="'+p.id+'" data-t="reqs">'+
      p.unknowns.length+' open question'+(p.unknowns.length>1?'s':'')+'</button>'
     :'<span style="color:var(--good)">none flagged</span>'}
  ];
  h+='<div class="tscroll" style="margin-top:22px"><table><thead><tr><th class="rowhead"></th>';
  S.paths.forEach((p,i)=>h+='<th style="color:'+seriesColor(i)+'"><button class="colhead" data-act="goto" data-id="'+p.id+'" data-t="top">'+esc(p.name||typeLabel(p.type))+'</button></th>');
  h+='</tr></thead><tbody>';
  rows.forEach(r=>{h+='<tr><th class="rowhead">'+esc(r.l)+'</th>';S.paths.forEach(p=>h+='<td>'+r.f(p)+'</td>');h+='</tr>';});
  h+='</tbody></table></div>';

  h+='<div class="sec"><h3>The two you are keeping open</h3><div class="subh">Not choosing. Keeping open. You can change this whenever.</div><div class="chips">';
  S.paths.forEach(p=>{const on=S.plan.keep.indexOf(p.id)>-1;
    h+='<button class="chip '+(on?'on':'')+'" data-act="keep" data-id="'+p.id+'">'+esc(p.name||typeLabel(p.type))+'</button>';});
  h+='</div>';
  if(S.plan.keep.length>2)h+='<p class="small" style="color:var(--warn);margin-top:10px">You have '+S.plan.keep.length+' selected. Two is the point of the exercise, but nobody is stopping you.</p>';
  h+='</div>';

  const oi=openItems();
  h+='<div class="sec"><h3>The next thing you will actually do</h3>'+
    '<div class="subh">One is enough. Another box appears once this one has something in it.</div>';
  if(oi.length){
    h+='<p class="small dim">From what you flagged as unknown: '+oi.slice(0,4).map(o=>esc(o.text)).join(' · ')+'</p>';
  }
  const filledN=S.plan.actions.filter(a=>(a.t||'').trim()).length;
  const showN=Math.min(S.plan.actions.length,filledN+1);
  for(let i=0;i<showN;i++){
    const a=S.plan.actions[i];
    h+='<div class="rrow"><div class="rq">'+(i===0?'Next':'Then')+'</div><div class="rin">'+
     '<input data-k="plan.actions.'+i+'.t" placeholder="What you will do" value="'+esc(a.t)+'">'+
     '<input type="date" style="max-width:210px" data-k="plan.actions.'+i+'.d" value="'+esc(a.d)+'"></div></div>';
  }
  h+='</div>';
  return h;
}

/* ---------- plan ---------- */
function fmtD(d){return d.toLocaleDateString(undefined,{month:'short',year:'numeric'});}
function fmtDay(d){return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}
function prettyDate(iso){
  if(!iso)return '';
  const d=new Date(iso+'T12:00:00');
  return isNaN(d)?iso:d.toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});
}
function vPlan(){
  let h='<div class="eyebrow">Plan</div><h1 style="font-size:clamp(27px,5vw,36px);margin-bottom:10px">Everything you owe, in order.</h1>'+
   '<p class="lede">Everything from every path, pulled into one list. Anything with a date sorts itself; the rest sits in its own group and ticks off and prints exactly the same. This is the page to open on a Sunday night.</p>'+
   '<div class="field" style="max-width:280px;margin-top:20px"><label>Your high-school graduation date</label>'+
   '<input type="date" data-k="plan.grad" value="'+esc(S.plan.grad)+'"></div>';
  if(!S.plan.grad)h+='<p class="small dim">A rough guess is fine. Setting it generates the standard junior-to-senior timeline, and every date moves with it if you change it.</p>';

  const b=buckets();
  const row=(it,hideSub)=>{
    const d=it.date?new Date(it.date+'T12:00:00'):null;
    const tag=it.color===null?'':'style="color:'+seriesColor(it.color)+'"';
    const meta=[];
    if(!hideSub)meta.push('<span '+tag+'>'+esc(it.sub)+'</span>');
    if(d)meta.push(fmtDay(d));
    return '<div class="ms '+(it.done?'done':'')+'">'+
      '<button class="msbox '+(it.done?'on':'')+'" data-act="tick" data-kind="'+it.kind+'" data-key="'+esc(it.key)+'" aria-label="mark done">'+(it.done?'✓':'')+'</button>'+
      '<div class="msbody"><div class="mstext">'+esc(it.text)+'</div>'+
      (meta.length?'<div class="msdate">'+meta.join(' · ')+'</div>':'')+
      (it.kind==='ms'&&(it.done||it.note)
        ? '<input class="small" style="margin-top:6px" data-k="plan.ms.'+it.key+'.note" placeholder="Note, link, or proof" value="'+esc(it.note||'')+'">'
        : '')+
      '</div></div>';
  };
  const head=(title,n,cls,sub)=>'<h3 '+(cls?'style="color:'+cls+'"':'')+'>'+title+
    ' <span class="dim" style="font-weight:400">('+n+')</span></h3>'+(sub?'<div class="subh">'+sub+'</div>':'');
  const group=(title,sub,items,cls)=>items.length
    ? '<div class="sec">'+head(title,items.length,cls,sub)+items.map(it=>row(it)).join('')+'</div>' : '';
  /* Undated and done lists get long, so they read by source rather than as one wall. */
  const grouped=(title,sub,items,cls)=>{
    if(!items.length)return '';
    let g='<div class="sec">'+head(title,items.length,cls,sub);
    groupBySub(items).forEach(pair=>{
      const c=pair[1][0].color;
      g+='<div style="margin-top:15px"><div class="ptype" style="margin-bottom:2px'+(c!==null?';color:'+seriesColor(c):'')+'">'+esc(pair[0])+'</div>'+
         pair[1].map(it=>row(it,true)).join('')+'</div>';
    });
    return g+'</div>';
  };

  if(!S.paths.length&&!S.plan.grad){
    h+='<div class="sec"><h3>Nothing here yet</h3><div class="subh">Add a path, or set your high-school graduation date above, and this fills itself in.</div></div>';
  }else{
    h+=group('Past due','Not a disaster. Do the oldest one first.',b.overdue,'var(--bad)');
    h+=group('Next 30 days','',b.soon,'var(--warn)');
    h+=group('Later','',b.later,'');
    if(b.undated.length){
      let note='These print and tick off just fine without a date. Adding one moves the item up into the dated lists.';
      if(!S.plan.grad)note+=' Setting your high-school graduation date above dates all '+MILESTONES.length+' timeline items at once.';
      h+=grouped('No date yet',note,b.undated,'');
    }
    h+=grouped('Done','',b.done,'var(--good)');
  }

  h+='<div class="sec"><h3>Take it with you</h3>'+
   '<div class="subh">A one-page checklist you can print, stick on a wall, and mark up with a pen. It pulls in your dates, your open questions, and the numbers for each path.</div>'+
   '<div style="display:flex;gap:10px;flex-wrap:wrap">'+
   '<button class="btn sm" data-act="print">Print or save as PDF</button>'+
   '<button class="btn ghost sm" data-act="md">Copy for Docs or Notes</button>'+
   (canDownload?'<button class="btn ghost sm" data-act="mdfile">Download as .md</button>':'')+
   '</div></div>';

  h+='<div class="sec"><h3>Send it to someone</h3>';
  if(canLink){
    h+='<div class="subh">Your counselor, a parent, whoever is helping. This sends a link that opens your whole plan in their browser: every tab, every number, exactly as you see it. Nothing to install, no account, and it works on a phone.</div>'+
     '<div style="display:flex;gap:10px;flex-wrap:wrap">'+
     '<button class="btn sm" data-act="sharelink">Send a link</button>'+
     (canSendCopy?'<button class="btn ghost sm" data-act="sharecopy">Send the page as a file</button>':'')+
     '<button class="btn ghost sm" data-act="copytext">Copy as plain text</button></div>'+
     '<p class="small dim" style="margin-top:12px">Your answers travel inside the link itself, in the part after the #. Browsers never send that to a server, so nothing about your plan is uploaded anywhere. The link is not secret though: anyone who has it can read it, so treat it like emailing a document.</p>'+
     '<p class="small dim">It is a snapshot, not a live view. What they open is your plan as it is right now, and it will not change when you do, so send a fresh link when it has moved on. The file version is the one to use if you want them to have a copy that keeps working with no internet.</p>';
  }else if(canSendCopy){
    h+='<div class="subh">Your counselor, a parent, whoever is helping. This sends a whole working copy of this page with your answers already in it. They open the file in a browser on a computer and can click through every tab exactly as you see it. Nothing to install, no account, works offline.</div>'+
     '<div style="display:flex;gap:10px;flex-wrap:wrap">'+
     '<button class="btn sm" data-act="sharecopy">Send a working copy</button>'+
     '<button class="btn ghost sm" data-act="mail">Send a plain-text summary instead</button>'+

<script data-app>

/* Emphasis is marked with ** so the same facts render correctly in both media:
   the print doc turns it into <b>, the markdown export leaves it alone. */
function planFacts(p){
  const e=eff(p), s2=series(p), f=fit(p), bits=[];
  bits.push('**'+typeLabel(p.type)+'**'+(p.loc?' · '+p.loc:''));
  bits.push('Costs **'+money(e.v.years*e.v.cost)+'** over '+e.v.years+' yr'+(e.v.years===1?'':'s')+(e.seeded.cost||e.seeded.years?' (estimated)':''));
  bits.push('Earns **'+money(e.v.after)+'**/yr after'+(e.seeded.after?' (estimated)':''));
  bits.push(s2.be?('In the black at **'+s2.be+'**'):'Never in the red');
  if(f)bits.push('Match **'+f.score+'%**');
  if(p.want)bits.push('Want it **'+p.want+'/5**');
  return bits;
}
const factsHtml=p=>planFacts(p).map(x=>esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')).join(' &nbsp;·&nbsp; ');
const factsMd=p=>planFacts(p).join(' · ');

function buildMarkdown(){
  const b=buckets(), L=['# Post-High-School Plan',''];
  const meta=[];
  if(S.plan.who)meta.push('**Student:** '+S.plan.who);

/* A whole working copy of this page with the current answers baked in. The page
   carries no external references, so its own serialised markup opens anywhere,
   offline, and stays interactive. */
function sharedHtml(){
  const clone=document.documentElement.cloneNode(true);
  /* drop anything host-injected or previously seeded, so copies never stack */
  /* Keep only this app's own scripts. Anything else in the document belongs to
     whatever page is hosting it, and must not ride along into the copy. */
  const kill=clone.querySelectorAll('script:not([data-app]), link[rel="preconnect"]');
  for(let i=0;i<kill.length;i++)kill[i].parentNode.removeChild(kill[i]);
  const body=clone.querySelector('body'); if(!body)return null;
  ['main','printdoc','copyarea','toast','sharedbar'].forEach(id=>{
    const el=clone.querySelector('#'+id);
    if(el){ if(el.tagName==='TEXTAREA')el.textContent=''; else el.innerHTML=''; }
  });
  const payload={
    from:(S.plan.who||'').trim(),
    at:new Date().toISOString(),
    id:'sh'+Math.abs(new Date().getTime()).toString(36),
    state:S
  };
  const seed=clone.ownerDocument.createElement('script');
  seed.id='seed';
  seed.textContent='window.__SEED__='+JSON.stringify(payload).replace(/</g,'\\u003c')+';';
  body.insertBefore(seed,body.firstChild);
  return '<!doctype html>\n'+clone.outerHTML;
}
function sharedFilename(){
  const who=(S.plan.who||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  return (who?who+'-':'')+'post-high-school-plan.html';
}

        await navigator.share({files:[file],title:subject});
        return;
      }
    }catch(err){ if(err&&err.name==='AbortError')return; }
  }
  if(canDownload){
    try{
      const b=new Blob([html],{type:'text/html'}), u=URL.createObjectURL(b);
      const link=document.createElement('a'); link.href=u; link.download=filename;
      document.body.appendChild(link); link.click(); link.remove();

  toast('This copy cannot hand over a file. Open the plan from the .html file on your computer and send it from there.');
}

/* ---------- write helpers ---------- */
function assign(root,path,val){
  const parts=path.split('.'); let o=root;
  for(let i=0;i<parts.length-1;i++){
    const k=/^\d+$/.test(parts[i])?Number(parts[i]):parts[i];
    if(o[k]==null||typeof o[k]!=='object')o[k]={};
    o=o[k];
  }
  o[parts[parts.length-1]]=val;
}
function writeKey(k,val){
  const bar=k.indexOf('|');
  if(bar>-1){const p=pathById(k.slice(0,bar)); if(p)assign(p,k.slice(bar+1),val);}
  else assign(S,k,val);
}

/* ---------- render ---------- */
const RENDER={welcome:vWelcome,mirror:vMirror,paths:vPaths,money:vMoney,compare:vCompare,plan:vPlan,backup:vBackup};
function renderNav(){

  /* The nav scrolls sideways on a phone, so keep the current tab visible. Scrolling
     the container directly rather than scrollIntoView, which would move the page. */
  if(!n.querySelector)return;
  const cur=n.querySelector('[aria-current="true"]');
  if(cur&&typeof cur.offsetLeft==='number')n.scrollLeft=Math.max(0,cur.offsetLeft-14);
}

/* ---------- backup ---------- */
function exportText(){return JSON.stringify({fmt:'nextmove',version:1,saved:new Date().toISOString(),state:S},null,2);}
function importText(t){
  let o; try{o=JSON.parse(t);}catch(e){toast('That is not readable as a backup.');return;}
  if(!o||o.fmt!=='nextmove'){toast('That file is not a Next Move backup.');return;}
  if(!(Number(o.version)<=1)){toast('That backup came from a newer version of this page.');return;}
  const st=o.state;
  if(!st||typeof st!=='object'||Array.isArray(st)){toast('That backup is missing its data. Nothing was changed.');return;}
  const n=hydrate(st);
  n.view=RENDER[st.view]?st.view:'paths';
  stashUndo(describeState(S));
  S=n; editing=null; adding=false; save(); render({top:true});
  toast('Backup loaded.',{act:'undo',label:'Undo'});
}

/* Saving a file: the hosted artifact must route through the downloads capability
   (its viewer never grants a page a direct download); the standalone file has no
   claude runtime and uses an object URL. */
async function saveBackup(){
  const text=exportText(), filename='next-move-backup.json';
  let api=null;
  try{ if(typeof claude!=='undefined'&&claude&&claude.use) api=await claude.use('downloads'); }catch(e){}
  if(api){
    try{ await api.save({filename:filename,data:text}); toast('Backup saved.'); }
    catch(err){
      const c=err&&err.code;
      if(c==='declined')toast('Save cancelled. Nothing left this page.');
      else if(c==='rate_limited')toast('Give it a second, then try again.');
      else toast('Could not save a file here. Use Copy backup text instead.');
    }
    return;
  }
  try{
    const b=new Blob([text],{type:'application/json'}), u=URL.createObjectURL(b);
    const link=document.createElement('a'); link.href=u; link.download=filename;
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(()=>URL.revokeObjectURL(u),3000);
    toast('If no file appeared, use Copy backup text instead.');
  }catch(err){toast('Download blocked here. Use Copy backup text instead.');}
}

/* The clipboard is refused in some browsers and in some embedded views, so every
   copy button falls back to putting the text on the page to be copied by hand. */
function copyOrShow(text,okMsg){
  const fall=()=>{
    const box=byId('copyout'), ta=byId('copyarea');
    if(!box||!ta){toast('Could not copy here.');return;}
    box.style.display='block'; ta.value=text;
    try{ ta.focus(); ta.select(); box.scrollIntoView({block:'nearest'}); }catch(e){}
  };
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(()=>toast(okMsg),fall);
  else fall();
}

  const a=el.dataset.act;
  if(a==='start'){S.view='mirror'; if(!Object.keys(S.ratings).length)S.mirrorIdx=0; save(); return render({top:true});}
  if(a==='go'){editing=null;adding=false;S.view=el.dataset.v;save();return render({top:true});}
  if(a==='rate'){S.ratings[el.dataset.f]=Number(el.dataset.n); S.mirrorIdx=Math.min(S.mirrorIdx+1,FACTORS.length); save(); return render({top:true});}
  if(a==='mskip'){const f=FACTORS[S.mirrorIdx]; if(f)delete S.ratings[f.id]; S.mirrorIdx=Math.min(S.mirrorIdx+1,FACTORS.length); save(); return render({top:true});}
  if(a==='mback'){S.mirrorIdx=Math.max(0,S.mirrorIdx-1); save(); return render({top:true});}
  if(a==='redo'){S.mirrorIdx=0; save(); return render({top:true});}
  if(a==='adding'){adding=true; return render();}
  if(a==='create'){const p=newPath(el.dataset.t); S.paths.push(p); adding=false; editing=p.id; save(); return render({top:true});}
  if(a==='edit'){editing=el.dataset.id; return render({top:true});}
  if(a==='goto'){
    const p=pathById(el.dataset.id); if(!p)return;
    editing=p.id; S.view='paths'; adding=false; save(); render({top:true});
    const g=GOTO[el.dataset.t]; if(g)focusIn(g(p));
    return;
  }
  if(a==='close'){editing=null; return render({top:true});}
  if(a==='del'){const p=pathById(el.dataset.id); if(!p)return;
    const nm=p.name||'this path';
    if(!confirm('Delete "'+nm+'" and everything written in it?'))return;
    stashUndo('"'+nm+'"');
    S.paths=S.paths.filter(x=>x.id!==p.id); S.plan.keep=S.plan.keep.filter(x=>x!==p.id);
    editing=null; save(); render({top:true});
    toast('Deleted '+nm+'.',{act:'undo',label:'Undo'});
    return;}
  if(a==='chip'){const p=pathById(el.dataset.id); if(!p)return;
    if(!p.chips)p.chips=[]; const c=el.dataset.c, i=p.chips.indexOf(c);
    if(i>-1)p.chips.splice(i,1); else p.chips.push(c); save(); return render();}
  if(a==='unk'){const p=pathById(el.dataset.id); if(!p)return;
    const r=el.dataset.r, i=p.unknowns.indexOf(r);
    if(i>-1)p.unknowns.splice(i,1); else p.unknowns.push(r); save(); return render();}
  if(a==='want'){const p=pathById(el.dataset.id); if(!p)return;
    const n=Number(el.dataset.n); p.want=(p.want===n?0:n); save(); return render();}
  if(a==='keep'){const id=el.dataset.id, i=S.plan.keep.indexOf(id);
    if(i>-1)S.plan.keep.splice(i,1); else S.plan.keep.push(id); save(); return render();}
  if(a==='note'){noteOpen[el.dataset.m]=true; return render();}
  if(a==='step'){stepOpen[el.dataset.key]=true; return render();}
  if(a==='tuesmore'){tuesMore[el.dataset.id]=true; return render();}
  if(a==='pick'){
    const p=pathById(el.dataset.id); if(!p)return;
    if(!p.pick)p.pick={};
    const f=el.dataset.f, v=el.dataset.v;
    if(el.dataset.multi){
      const arr=Array.isArray(p.pick[f])?p.pick[f].slice():[];
      const i=arr.indexOf(v); if(i>-1)arr.splice(i,1); else arr.push(v);
      p.pick[f]=arr;
    }else p.pick[f]=(p.pick[f]===v?'':v);
    save(); return render();
  }
  if(a==='stamp'){
    const p=pathById(el.dataset.id); if(!p)return;
    const f=el.dataset.f;
    p.proof[f]=p.proof[f]?'':isoOf(new Date());
    save(); return render();
  }
  if(a==='tick'){
    const kind=el.dataset.kind, t=tickTarget(kind,el.dataset.key);
    if(!t)return;
    if(kind==='unk'){
      const i=t.unknownOn.unknowns.indexOf(t.rid);
      if(i>-1)t.unknownOn.unknowns.splice(i,1);
      toast('Marked as answered. Write what you found on that path.');
    }else if(kind==='act'){t.done=!t.done;}
    else{t.done=!t.done;}
    save(); return render();
  }
  if(a==='print'){buildPrintDoc(); setTimeout(()=>window.print(),60); return;}
  if(a==='md'){copyOrShow(buildMarkdown(),'Plan copied. Paste it into Docs, Notes, or an email.'); return;}
  if(a==='mdfile'){saveMarkdown(); return;}
  if(a==='share'){shareIt(); return;}
  if(a==='mail'){mailIt(); return;}
  if(a==='copytext'){copyOrShow(buildShareText(),'Copied. Paste it into an email or a message.'); return;}
  if(a==='sharecopy'){shareCopy(); return;}
  if(a==='sharelink'){shareLink(); return;}
  if(a==='ms'){const m=el.dataset.m; if(!S.plan.ms[m])S.plan.ms[m]={done:false,note:''};
    S.plan.ms[m].done=!S.plan.ms[m].done; save(); return render();}
  if(a==='dl'){saveBackup(); return;}
  if(a==='copy'){copyOrShow(exportText(),'Backup copied to your clipboard.'); return;}
  if(a==='pickfile'){byId('fileIn').click(); return;}
  if(a==='pastetoggle'){const b=byId('pasteBox'); b.style.display=(b.style.display==='none'?'block':'none'); if(b.style.display==='block')byId('pasteArea').focus(); return;}
  if(a==='paste'){const v=byId('pasteArea').value.trim(); if(!v){toast('Nothing pasted yet.');return;} return importText(v);}
  if(a==='reset'){
    const bits=[];
    if(S.paths.length)bits.push(S.paths.length+' path'+(S.paths.length===1?'':'s'));
    const r=Object.keys(S.ratings).length; if(r)bits.push(r+' rating'+(r===1?'':'s'));
    if(S.plan.grad||Object.keys(S.plan.ms).length)bits.push('your plan');
    const what=bits.length?bits.join(', '):'everything';
    if(!confirm('Erase '+what+'?\n\nThis clears the page and returns you to the start.'))return;
    stashUndo(what);
    try{localStorage.removeItem(KEY);}catch(err){}
    S=blank(); editing=null; adding=false; render({top:true});
    toast('Erased '+what+'.',{act:'undo',label:'Undo'});
    return;}
  if(a==='undo'){restoreUndo(); return;}
  if(a==='forgetundo'){dropUndo(); render(); toast('Cleared.'); return;}
});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.k; if(!k)return; writeKey(k,e.target.value); save();});
document.addEventListener('change',e=>{
  const cp=e.target.dataset&&e.target.dataset.copy;
  if(cp){copySection(e.target.dataset.id,e.target.value,cp); return;}
  if(e.target.id==='fileIn'){const f=e.target.files&&e.target.files[0]; if(!f)return;
    const r=new FileReader(); r.onload=()=>importText(String(r.result)); r.onerror=()=>toast('Could not read that file.'); r.readAsText(f); e.target.value=''; return;}
  const k=e.target.dataset&&e.target.dataset.k; if(!k)return;
  if(e.target.value==='__other'&&/\|money\.years$/.test(k)){
    yearsOther[k.slice(0,k.indexOf('|'))]=true; writeKey(k,''); save(); return render();
  }
  writeKey(k,e.target.value); save(); render();
});
byId('themeBtn').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':cur==='light'?'':'dark';
  if(next)document.documentElement.setAttribute('data-theme',next); else document.documentElement.removeAttribute('data-theme');
  try{localStorage.setItem('nextmove.theme',next);}catch(e){}
});

/* ---------- boot ---------- */
try{const t=localStorage.getItem('nextmove.theme'); if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
function showSharedBanner(){
  const bar=byId('sharedbar'); if(!bar||!SEED)return;
  const who=(SEED.from||'').trim();
  let when='';
  try{ if(SEED.at)when=' on '+new Date(SEED.at).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'}); }catch(e){}
  bar.innerHTML='You are looking at <b>'+esc(who?who+"'s plan":'a plan someone shared with you')+'</b>'+esc(when)+
    '. Anything you change stays on this device and does not reach them.';
  bar.style.display='block';
}
/* Take over from a plan that arrived in a link. Anything the reader already did
   with this same link wins over the seed, exactly as with a shared file. */
function adoptShared(payload){
  SEED=payload;
  KEY=sharedKey(payload.id);
  let raw=null; try{raw=localStorage.getItem(KEY);}catch(e){}
  let restored=false;
  if(raw){ try{ const o=JSON.parse(raw); if(o&&o.version===1){S=hydrate(o); restored=true;} }catch(e){} }
  if(!restored){ S=hydrate(payload.state); if(S.view==='welcome')S.view='plan'; }
  showSharedBanner();
  render({top:true});
}
function shareLinkFailed(msg){
  byId('topbar').classList.add('hide');
  byId('main').innerHTML='<div class="welcome"><div class="eyebrow">Shared plan</div>'+
    '<h1 style="font-size:clamp(28px,6vw,44px)">This link did not open.</h1>'+
    '<p class="lede">'+esc(msg)+' Ask whoever sent it to send a fresh one, or to paste their backup text instead.</p>'+
    '<div><button class="btn" data-act="go" data-v="paths">Start my own instead</button></div></div>';
}

load();
if(S.view!=='welcome'&&!RENDER[S.view])S.view='welcome';
if(SEED)showSharedBanner();

if(hashSeed){
  byId('topbar').classList.add('hide');
  byId('main').innerHTML='<div class="welcome"><div class="eyebrow">Shared plan</div>'+
    '<h1 style="font-size:clamp(28px,6vw,44px)">Opening a shared plan…</h1>'+
    '<p class="lede">Unpacking it from the link. This happens on your device; nothing is downloaded.</p></div>';
  decodeSeed(hashSeed).then(adoptShared).catch(function(err){
    shareLinkFailed(err&&/gzip/.test(String(err&&err.message))
      ? 'This browser cannot unpack it.'
      : 'The link looks incomplete, which usually means it was cut short on the way.');
  });
}else{
  render({top:true});
}
</script>
